<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0e1b2c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Şoför Paneli">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="NoktaTedarik-Logo.jpg">
<title>NOKTA TEDARİK — Şoför Paneli</title>
<style>
  :root { --turuncu:#f77f00; --turuncu-koyu:#d96b00; --mavi:#0e1b2c; --yesil:#1faa4c; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI',Tahoma,Arial,sans-serif; background:#f4f7fb; color:#33465c; }
  .ust { background:linear-gradient(135deg,#0e1b2c,#1b2f4a); color:#fff; padding:18px 16px; text-align:center; position:sticky; top:0; z-index:5; box-shadow:0 4px 18px rgba(14,27,44,.25); }
  .ust h1 { font-size:1.05rem; letter-spacing:2px; }
  .ust .alt { font-size:.78rem; opacity:.85; margin-top:4px; }
  .ust .sehir { color:#ffb347; font-weight:800; font-size:1.05rem; }
  .ozet { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:#fff; border-bottom:1px solid #e3eaf2; position:sticky; top:78px; z-index:4; }
  .ozet b { color:var(--turuncu-koyu); font-size:1.25rem; }
  .ozet span { font-size:.78rem; color:#6b7f94; }
  .liste { padding:12px; display:grid; gap:10px; }
  .magaza { background:#fff; border-radius:14px; padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; border:1px solid #e3eaf2; box-shadow:0 2px 8px rgba(14,27,44,.05); }
  .magaza .ad { font-weight:700; font-size:.92rem; }
  .magaza .saat { font-size:.75rem; color:#6b7f94; margin-top:2px; }
  .btn { border:none; border-radius:999px; padding:11px 18px; font-weight:800; font-size:.84rem; cursor:pointer; transition:.2s; }
  .btn.teslim { background:linear-gradient(135deg,#f77f00,#d96b00); color:#fff; box-shadow:0 4px 12px rgba(247,127,0,.35); }
  .btn.teslim:active { transform:scale(.94); }
  .btn.tamam { background:#e8f5ec; color:var(--yesil); }
  .giris { max-width:340px; margin:80px auto; background:#fff; border-radius:18px; padding:28px 22px; text-align:center; box-shadow:0 12px 30px rgba(14,27,44,.1); }
  .giris h2 { color:var(--mavi); font-size:1.1rem; letter-spacing:1px; }
  .giris p { font-size:.8rem; color:#6b7f94; margin-top:6px; }
  .giris input { width:100%; padding:13px; font-size:1.15rem; letter-spacing:8px; text-align:center; border:2px solid #e3eaf2; border-radius:12px; margin:16px 0 8px; outline:none; }
  .giris input:focus { border-color:var(--turuncu); }
  .giris .btn { width:100%; }
  .hata { color:#d64545; font-size:.8rem; height:20px; }
  .bos { text-align:center; color:#6b7f94; padding:40px 16px; }
  .cikis { position:absolute; right:12px; top:12px; background:none; border:1px solid rgba(255,255,255,.4); color:#fff; border-radius:8px; padding:6px 10px; font-size:.72rem; cursor:pointer; }
  .baglanti { font-size:.7rem; color:#9fb0c3; padding:4px 16px 12px; text-align:center; }
</style>
</head>
<body>

<div class="ust" id="baslik-kap">
  <button class="cikis" id="cikis-btn" style="display:none;">Çıkış</button>
  <h1>NOKTA TEDARİK · ŞOFÖR PANELİ</h1>
  <div class="alt" id="baslik-alt">Bugünkü şehir: <span class="sehir" id="sehir-ad">—</span></div>
</div>

<div class="giris" id="giris-kap">
  <h2>ŞOFÖR GİRİŞİ</h2>
  <p>Telefona şifreyi girin</p>
  <input type="password" id="pin" inputmode="numeric" maxlength="6" placeholder="••••••">
  <div class="hata" id="hata"> </div>
  <button class="btn teslim" id="giris-btn">GİRİŞ YAP</button>
</div>

<div style="display:none;" id="panel">
  <div class="ozet">
    <div><span>Bugünkü teslimat</span><br><b id="ozet-sayi">0 / 30</b></div>
    <div style="text-align:right;"><span>Teslim edilen</span><br><b id="ozet-tamam">0</b></div>
  </div>
  <div style="padding:10px 16px; background:#fff; border-bottom:1px solid #e3eaf2; display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
    <div style="font-size:.78rem; color:#6b7f94;">Tahmini dönüş: <b style="color:var(--turuncu-koyu);" id="donus-saat">—</b></div>
    <a class="btn teslim" id="depo-btn" href="tel:+905375966856" style="text-decoration:none; padding:9px 14px; font-size:.78rem;">📞 BÜYÜK PATRONU ARA</a>
  </div>
  <div class="liste" id="liste"></div>
  <div style="padding:0 16px 8px;"><button class="btn teslim" id="test-btn" style="width:100%;">TEST BİLDİRİMİ GÖNDER</button></div>
  <div class="baglanti" id="baglanti">Bağlantı kuruluyor...</div>
</div>

<script>
  var PIN = '177544';
  var FIREBASE_URL = 'https://nokta-tedarik-default-rtdb.firebaseio.com';
  var HAFTA = ['', 'Samsun', 'Amasya', 'Çorum', 'Sivas', 'Yozgat', ''];
  var MAGAZA_SAYISI = 30;
</script>
<script src="magazalar.js"></script>
<script>

  function bugunkuSehir() { return HAFTA[new Date().getDay()]; }
  function tarihYaz(d) {
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function yol(sehir) {
    return FIREBASE_URL + '/gunluk/' + tarihYaz(new Date()) + '/' + sehir + '.json';
  }

  var girisKap = document.getElementById('giris-kap');
  var panel = document.getElementById('panel');
  var liste = document.getElementById('liste');
  var pinEl = document.getElementById('pin');
  var hata = document.getElementById('hata');
  var sehirEl = document.getElementById('sehir-ad');
  var baglanti = document.getElementById('baglanti');
  var cikisBtn = document.getElementById('cikis-btn');

  var sehir = bugunkuSehir();
  sehirEl.textContent = sehir || 'Hafta sonu';
  document.getElementById('baslik-alt').style.display = sehir ? '' : 'none';

  function girisYap() {
    if (pinEl.value.trim() === PIN) {
      localStorage.setItem('sofor-pin', 'ok');
      hata.textContent = '';
      girisKap.style.display = 'none';
      panel.style.display = '';
      cikisBtn.style.display = '';
      baslat();
      bildirimIzinIste();
    } else {
      hata.textContent = 'Yanlış şifre';
      pinEl.value = '';
      pinEl.focus();
    }
  }
  document.getElementById('giris-btn').addEventListener('click', girisYap);
  pinEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') girisYap(); });
  cikisBtn.addEventListener('click', function () {
    localStorage.removeItem('sofor-pin');
    panel.style.display = 'none';
    cikisBtn.style.display = 'none';
    girisKap.style.display = '';
  });

  document.getElementById('test-btn').addEventListener('click', function () {
    if (!('Notification' in window)) { baglanti.textContent = 'Bu tarayıcı bildirim desteklemiyor'; return; }
    if (Notification.permission !== 'granted') {
      Notification.requestPermission().then(function (p) {
        if (p === 'granted') { bildirimGonder('Bildirimler çalışıyor!'); baglanti.textContent = 'Bildirim gönderildi — izin verildi'; }
        else baglanti.textContent = 'İzin verilmedi';
      });
    } else {
      bildirimGonder('Bildirimler çalışıyor!');
      baglanti.textContent = 'Bildirim gönderildi';
    }
  });

  var durumlar = {};
  var ilKm = { Samsun: 150, Amasya: 90, Çorum: 180, Sivas: 95, Yozgat: 160, Kayseri: 220 };
  var ortalamaHiz = 85;
  function varisSaati(s) {
    var km = ilKm[s] || 100;
    var saatDegeri = 8 + km / ortalamaHiz;
    var tamsayi = Math.floor(saatDegeri);
    var dakika = Math.round((saatDegeri - tamsayi) * 60);
    if (dakika === 60) { tamsayi++; dakika = 0; }
    return ('0' + tamsayi).slice(-2) + ':' + ('0' + dakika).slice(-2);
  }
  function donusSaati(s) {
    var km = ilKm[s] || 100;
    var saatDegeri = 8 + km / ortalamaHiz + 30 * 15 / 60;
    var tamsayi = Math.floor(saatDegeri);
    var dakika = Math.round((saatDegeri - tamsayi) * 60);
    if (dakika === 60) { tamsayi++; dakika = 0; }
    if (tamsayi >= 24) tamsayi -= 24;
    return ('0' + tamsayi).slice(-2) + ':' + ('0' + dakika).slice(-2);
  }
  function normalize(s) { return s.toUpperCase().replace('İ', 'I'); }
  function listeCiz() {
    var gunlukListe = null;
    var hedef = normalize(sehir);
    for (var l = 0; l < MAGAZALAR.length; l++) {
      if (normalize(MAGAZALAR[l].sehir) === hedef) { gunlukListe = MAGAZALAR[l].magazalar; break; }
    }
    var toplamMagaza = gunlukListe ? gunlukListe.length : MAGAZA_SAYISI;
    var html = '';
    for (var i = 1; i <= toplamMagaza; i++) {
      var d = durumlar[i] || null;
      var ad = 'Mağaza ' + i;
      var alt = '';
      if (gunlukListe && gunlukListe[i - 1]) {
        ad = gunlukListe[i - 1].m;
        alt = gunlukListe[i - 1].i;
      }
      html += '<div class="magaza">' +
        '<div><div class="ad">' + ad + '</div>' +
        '<div class="saat">' + (d ? (d.red ? '✗ ' + d.red : 'Teslim: ' + d.saat) : alt || 'Bekliyor') + '</div></div>' +
        (d
          ? (d.red
            ? '<button class="btn geri-al" data-geri="' + i + '" style="background:#fdecea;color:#c0392b;">✗ ' + d.red + '</button>'
            : '<button class="btn tamam" data-geri="' + i + '">✓ Teslim Edildi</button>')
          : '<div style="display:flex;gap:6px;">' +
            '<button class="btn teslim" data-no="' + i + '">✓</button>' +
            '<button class="btn red" data-red="' + i + '" style="background:#fdecea;color:#c0392b;padding:11px 10px;">✗</button>' +
            '</div>') +
        '</div>';
    }
    liste.innerHTML = html;
    var toplam = 0;
    for (var k in durumlar) toplam++;
    document.getElementById('ozet-sayi').textContent = toplam + ' / ' + toplamMagaza;
    document.getElementById('ozet-tamam').textContent = toplam;
    document.getElementById('donus-saat').textContent = sehir ? donusSaati(sehir) : '—';
  }

  liste.addEventListener('click', function (e) {
    var btn = e.target.closest('.btn.teslim');
    if (btn) {
      var no = btn.getAttribute('data-no');
      var adres = FIREBASE_URL + '/gunluk/' + tarihYaz(new Date()) + '/' + sehir + '/' + no + '.json';
      fetch(adres, {
        method: 'PUT',
        body: JSON.stringify({ saat: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }) })
      }).then(function () {
        durumlar[no] = { saat: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }) };
        listeCiz();
      }).catch(function () {
        baglanti.textContent = 'Bağlantı hatası — Firebase adresi kurulmadı';
      });
      return;
    }
    var geriBtn = e.target.closest('.btn.tamam');
    if (geriBtn && confirm('Bu mağazanın teslim işaretini geri al? Sayı düşer.')) {
      var no2 = geriBtn.getAttribute('data-geri');
      var adres2 = FIREBASE_URL + '/gunluk/' + tarihYaz(new Date()) + '/' + sehir + '/' + no2 + '.json';
      fetch(adres2, { method: 'DELETE' }).then(function () {
        delete durumlar[no2];
        listeCiz();
      }).catch(function () {
        baglanti.textContent = 'Bağlantı hatası';
      });
    }
    var redBtn = e.target.closest('.btn.red');
    if (redBtn) {
      var no3 = redBtn.getAttribute('data-red');
      var neden = prompt('Teslim edilemedi — nedeni yaz (örn: Kapalı, Adres yok, Ürün reddedildi):', 'Kapalı');
      if (neden === null || !neden.trim()) return;
      var adres3 = FIREBASE_URL + '/gunluk/' + tarihYaz(new Date()) + '/' + sehir + '/' + no3 + '.json';
      fetch(adres3, {
        method: 'PUT',
        body: JSON.stringify({ saat: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }), red: neden.trim() })
      }).then(function () {
        durumlar[no3] = { red: neden.trim() };
        listeCiz();
      }).catch(function () {
        baglanti.textContent = 'Bağlantı hatası';
      });
    }
    var geriRed = e.target.closest('.btn.geri-al');
    if (geriRed && confirm('Bu mağazanın "teslim edilemedi" işaretini geri al?')) {
      var no4 = geriRed.getAttribute('data-geri');
      var adres4 = FIREBASE_URL + '/gunluk/' + tarihYaz(new Date()) + '/' + sehir + '/' + no4 + '.json';
      fetch(adres4, { method: 'DELETE' }).then(function () {
        delete durumlar[no4];
        listeCiz();
      }).catch(function () {
        baglanti.textContent = 'Bağlantı hatası';
      });
    }
  });

  function yukle() {
    if (!sehir) { baglanti.textContent = 'Bugün dağıtım yok (hafta sonu)'; return; }
    fetch(yol(sehir)).then(function (r) { return r.json(); }).then(function (d) {
      if (d) {
        durumlar = {};
        for (var anahtar in d) {
          if (d[anahtar] && (d[anahtar].saat || d[anahtar].red)) durumlar[anahtar] = d[anahtar];
        }
      } else {
        durumlar = {};
      }
      listeCiz();
      baglanti.textContent = 'Çevrimiçi — canlı senkronize';
    }).catch(function () {
      baglanti.textContent = 'Firebase adresi kurulmadı — yöneticiye bildirin';
    });
  }

  function baslat() {
    yukle();
    setInterval(yukle, 4000);
  }

  var bildirimIsmi = 'NOKTA TEDARİK';
  function bildirimIzinIste() {
    if (!('Notification' in window)) return;
    if (Notification.permission === 'granted') return;
    Notification.requestPermission().then(function (p) {
      if (p === 'granted') baglanti.textContent = 'Çevrimiçi — bildirimler açık';
    });
  }
  function bildirimGonder(metin) {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    try {
      navigator.serviceWorker.ready.then(function (reg) {
        reg.showNotification(bildirimIsmi, { body: metin, icon: 'NoktaTedarik-Logo.jpg', badge: 'NoktaTedarik-Logo.jpg', tag: 'hatirlatma' });
      });
    } catch (e) { }
  }

  function hatirlatmaKontrol() {
    if (!sehir) return;
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    var simdi = new Date();
    var gun = tarihYaz(simdi);
    var saat = simdi.getHours();
    var dakika = simdi.getMinutes();
    if (dakika < 1 || dakika > 3) return;
    if (localStorage.getItem('hatir-saat') === gun + '-' + saat) return;
    var teslimSayi = 0;
    for (var k in durumlar) teslimSayi++;
    if (saat >= 11) {
      if (teslimSayi < 30) {
        bildirimGonder((30 - teslimSayi) + ' mağaza henüz işaretlenmedi! Bugünkü teslimatı kontrol et.');
        localStorage.setItem('hatir-saat', gun + '-' + saat);
      }
    }
  }

  function pwaKur() {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function () { });
    }
    setInterval(hatirlatmaKontrol, 60000);
  }
  pwaKur();

  if (localStorage.getItem('sofor-pin') === 'ok') {
    girisKap.style.display = 'none';
    panel.style.display = '';
    cikisBtn.style.display = '';
    baslat();
  }
</script>
</body>
</html>
